<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棕熊目击站</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>棕熊目击站</h1>
      <p class="info">共收到 <span id="record-count">3</span> 条目击记录</p>
    </header>

    <main>
      <section class="records">
        <h2>最近的目击</h2>

        <div class="record">
          <h3>可可西里</h3>
          <p class="meta"><span class="region">青海</span> 2026-09-12　2 头</p>
          <p>一大一小在河边喝水，看到车辆后慢慢走开。</p>
        </div>

        <div class="record">
          <h3>那曲</h3>
          <p class="meta"><span class="region">西藏</span> 2026-08-30　1 头</p>
          <p>在牧民的房子附近翻找食物。</p>
        </div>

        <div class="record">
          <h3>石渠</h3>
          <p class="meta"><span class="region">四川</span> 2026-08-21　1 头</p>
          <p>在草坡上挖鼠兔洞，持续约二十分钟。</p>
        </div>
      </section>

      <section class="report">
        <h2>上报目击</h2>
        <form action="sightings.html" method="get">
          <p>
            <label for="nick">昵称</label>
            <input type="text" id="nick" name="nick" required>
          </p>
          <p>
            <label for="date">日期</label>
            <input type="date" id="date" name="date" required>
          </p>
          <p>
            <label for="place">地点</label>
            <input type="text" id="place" name="place" required placeholder="例如 可可西里">
          </p>
          <p>
            <label for="count">数量</label>
            <input type="number" id="count" name="count" min="1" max="20" value="1">
          </p>
          <div class="buttons">
            <button type="submit" class="btn-submit">提交</button>
            <button type="reset" class="btn-reset">重填</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
